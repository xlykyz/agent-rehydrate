name: Backfill contribution for 2026-08-06

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backfill-2026-08-06.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create dated contribution commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RyanXia"
          git config user.email "78470116+xlykyz@users.noreply.github.com"
          mkdir -p .github/contributions
          printf '%s\n' 'Backfilled contribution for 2026-08-06 (Asia/Shanghai).' > .github/contributions/2026-08-06.txt
          git add .github/contributions/2026-08-06.txt
          GIT_AUTHOR_DATE='2026-08-06T12:00:00+08:00' \
          GIT_COMMITTER_DATE='2026-08-06T12:00:00+08:00' \
          git commit --date='2026-08-06T12:00:00+08:00' -m 'chore: backfill contribution for 2026-08-06'
          git push origin HEAD:main
